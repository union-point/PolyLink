<!DOCTYPE html>
<html lang="hy">

<head>
  <link rel="icon" type="image/svg+xml" href="./image/favicon.svg">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Երկփուլային վավերացում | PolyLink</title>
    <link rel="stylesheet" href="./css/auth.css" />
</head>

<body>
    <div class="container">
        <div class="login-box">
            <div class="logo-container">
                <img class="img" src="./image/logo.png" alt="PolyLink">
                <h1 class="logo-text">PolyLink</h1>
            </div>
            <p class="info-text">
                Մուտքն ավարտելու համար մուտքագրեք Ձեր էլ․ փոստին ուղարկված վեցանիշ կոդը։
            </p>

            <form novalidate id="verify-form">
                <div class="code-inputs">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" />
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" />
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" />
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" />
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" />
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" />
                </div>

                <button type="submit" class="signin-btn btn-t">Հաստատել</button>

                <p class="resend-text">
                    Չե՞ք ստացել կոդը։ <button type="button" class="resend-link" id="resend-btn">Կրկին ուղարկել</button>
                    <span class="timer" id="timer"></span>
                </p>

                <p class="bottom-text">
                    <a href="login.html">← Վերադառնալ</a>
                </p>
            </form>
        </div>
    </div>

    <script type="module" src="./js/2fa-verify.js"></script>

</body>

</html>
