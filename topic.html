<!DOCTYPE html>

<html lang="hy">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Թեմա | PolyLink Ֆորում</title>
<link href="./css/topic.css" rel="stylesheet"/>
<link href="./css/style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="./css/forum-controls.css" rel="stylesheet"/>
</head>
<body>
<header class="header">
<div class="header-container">
<div class="logo-container">
<img alt="Logo" class="logo-img" src="./image/logo.png"/>
<h3 class="logo-text">PolyLink</h3>
</div>
<nav>
<ul class="menu">
<li><a href="profile.html">Անձնական էջ</a></li>
<li><a href="events.html">Իրադարձություններ</a></li>
<li><a class="active" href="forum.html">Ֆոռում</a></li>
<li><a href="message.html">Նամակագրություն</a></li>
<li><a href="search.html">Որոնում</a></li>
</ul>
<!-- Dropdown menu -->
<div class="dropdown-container">
<button class="dropdown-btn">☰</button>
<ul class="dropdown-menu">
<li><a href="help.html">Help</a></li>
<li><a href="settings.html">Կարգավորումներ</a></li>
<li><a href="login.html">Դուրս գալ</a></li>
</ul>
</div>
</nav>
</div>
</header>
<main class="container">
<!-- Breadcrumb Navigation -->
<nav class="breadcrumb">
<a href="forum.html">← Վերադառնալ ֆորում</a>
</nav>
<!-- Topic Header -->
<article class="topic-header">
<div class="topic-badge"></div>
<h1 class="topic-title"></h1>
<div class="topic-author-info">
<div class="author-avatar">
<img alt="Արմեն Ղազարյան" src="./image/logo.png"/>
</div>
<div class="author-details">
<div class="author-name"></div>
<div class="author-meta">
<span class="separator">•</span>
<span class="post-date"></span>
</div>
</div>
</div>
</article>
<!-- Original Post -->
<section class="original-post">
<div class="post-content"></div>
</section>
<!-- Replies Section -->
<section class="replies-section">
<div class="replies-header">
<h2>Պատասխաններ <span class="reply-count">(0)</span></h2>
<select class="sort-select">
<option value="newest">Նորագույն</option>
<option value="oldest">Հնագույն</option>
<option value="popular">Ամենաօգտակար</option>
</select>
</div>
<!-- Reply Item -->

<!-- Reply Item -->

<!-- Reply Item -->

<!-- Reply Item -->

</section>
<!-- Reply Form -->
<section class="reply-form-section">
<h3>Ավելացնել պատասխան</h3>
<form class="reply-form">
<div class="form-avatar">
<img alt="Դուք" src="./image/logo.png"/>
</div>
<div class="form-content">
<textarea class="reply-textarea" placeholder="Գրեք ձեր պատասխանը այստեղ..." rows="4"></textarea>
<div class="form-actions">
<div class="formatting-tools">
<button class="format-btn" title="Թավ" type="button">
<svg fill="currentColor" height="16" viewbox="0 0 24 24" width="16">
<path d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"></path>
</svg>
</button>
<button class="format-btn" title="Շեղ" type="button">
<svg fill="currentColor" height="16" viewbox="0 0 24 24" width="16">
<path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"></path>
</svg>
</button>
<button class="format-btn" title="Հղում" type="button">
<svg fill="none" height="16" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="16">
<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
</svg>
</button>
</div>
<button class="submit-btn" type="submit">Հրապարակել պատասխան</button>
</div>
</div>
</form>
</section>
</main>
<script src="./js/forum.js" type="module"></script>
</body>
</html>
