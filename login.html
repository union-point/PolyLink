<!DOCTYPE html>
<html lang="hy">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Մուտք | PolyLink</title>

  <link rel="stylesheet" href="./css/auth.css" />

</head>

<body>
  <div class="container">
    <div class="login-box">
      <div class="logo-container">
        <img class="img" src="./image/logo.png" alt="PolyLink">
        <h1 class="logo-text">PolyLink</h1>
      </div>
      <h2 class="auth-title">Մուտք գործեք Ձեր հաշիվ</h2>
      <form novalidate id="login-form">
        <label for="email">Էլ. փոստ</label>
        <input type="email" id="email" name="email" autocomplete="email" maxlength="255" required placeholder="name@polytechnic.am" />

        <label for="password">Գաղտնաբառ</label>

        <div class="password-wrapper">
          <input type="password" id="password" name="password" autocomplete="current-password" maxlength="128" required placeholder="Մուտքագրեք Ձեր գաղտնաբառը" />
          <button type="button" class="toggle-password" id="toggle-new">👁️</button>
        </div>
        

        <a href="forgot.html" class="forgot">Մոռացե՞լ եք գաղտնաբառը։</a>

        <button type="submit" class="signin-btn">Մուտք</button>
        <p class=" bottom-text">
          Հաշիվ չունե՞ք։ <a href="register.html">Գրանցվել</a>
        </p>

      </form>
    </div>
  </div>


  <script type="module" src="./js/login.js"></script>




</body>


</html>
