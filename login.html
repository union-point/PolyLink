<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyLink</title>

  <link rel="stylesheet" href="./css/auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>

<body>
  <div class="container">
    <div class="login-box">
      <div class="logo-container">
        <img class="img" src="./image/logo.png" alt="Logo" class="logo-img">
        <h1 class="logo-text">PolyLink</h1>
      </div>
      <form id="login-form">
        <label for="email">Էլ. փոստ</label>
        <input type="text" id="email" placeholder="օրինակ@polytech.am" />

        <label for="password">Գաղտնաբառ</label>

        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Մուտքագրեք Ձեր գաղտնաբառը" />
          <button type="button" class="toggle-password" id="toggle-new">👁️</button>
        </div>
        <p class="error-message">Սխալ Էլ. փոստ կամ Գաղտնաբառ</p>

        <a href="forgot.html" class="forgot">Մոռացե՞լ եք գաղտնաբառը։</a>

        <button type="submit" class="signin-btn">Մուտք</button>
        <p class=" bottom-text">
          Հաշիվ չունե՞ք։ <a href="register.html">Գրանցվել</a>
        </p>

      </form>
    </div>
  </div>

  <!---!!!--- remove after testing ---!!!----->
  <script src="./js/login.js"></script>




</body>


</html>
