        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /chat/rooms/{roomId}/messages:
    get:
      operationId: history
      description: before and after are mutually exclusive exclusive sequence bounds.
        Default latest page. Return chronological items. nextAfter advances only through
        emitted committed messages. Tombstones preserve sequence positions. Hide/join
        cutoffs filter history; a key does not grant history access.
      security:
      - bearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
          headers:
            Cache-Control:
              schema:
                const: no-store
              description: Sensitive responses are never cached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - &id001
        name: roomId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: before
        in: query
        schema:
          $ref: '#/components/schemas/Version'
      - name: after
        in: query
        schema:
          $ref: '#/components/schemas/Version'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    post:
      operationId: send
      description: Authorization -> stored operation lookup -> fingerprint match ->
        for new operations current version/send checks and one sequence/message commit.
        Replay precedes key freshness, obeying current result visibility. Unknown
        network outcome requires identical operation and packet; only explicit KEY_STALE_NOT_SAVED/ROOM_KEY_PENDING
        rejection permits a new operation.
      security:
      - bearer: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          headers:
            Cache-Control:
              schema:
                const: no-store
              description: Sensitive responses are never cached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '200':
          description: Matching stored operation returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      parameters: &id002
      - *id001
  /chat/rooms/{roomId}/keys:
