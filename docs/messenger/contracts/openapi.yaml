openapi: 3.1.1
info:
  title: PolyLink messenger
  version: 0.2.0
  description: M0 wire formats with M1 invitation enrollment, real sessions and backed-up
    key setup. Only the M1 endpoints are implemented; messaging and recovery remain
    later milestones. Original passwords never enter HTTP DTOs.
servers:
- url: http://localhost:3004
  description: Local development; deployment requires HTTPS
security:
- bearer: []
paths:
  /auth/parameters:
    post:
      operationId: parameters
      description: ''
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Derivation'
          headers:
            Cache-Control:
              schema:
                const: no-store
              description: Sensitive responses are never cached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /auth/register:
    post:
      operationId: register
      description: M1 requires an operator-approved, unexpired, single-use email/role
        invitation for enrollment. Verification/resend is browser-bound and credential-version-bound;
        revoked/replaced enrollment cannot reuse an old proof.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          headers:
            Cache-Control:
