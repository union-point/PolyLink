  /keys/setup/prepare:
    post:
      operationId: setupPrepare
      description: Idempotent immutable prepared package. Same operation with changed
        bytes conflicts. Plain serviceVaultKey is permitted only for setup and service
        recovery; never persisted. Local recovery and password change retain the existing
        service copy. The kind must match the server-authorized operation; service
        unlock permanently selects RECOVERY_SERVICE for that operation.
      security:
      - bearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
          headers:
            Cache-Control:
              schema:
                const: no-store
              description: Sensitive responses are never cached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PrepareKeyPackage'
              - properties:
                  kind:
                    enum:
                    - SETUP
  /keys/setup/commit:
    post:
      operationId: setupCommit
      description: Atomic expected-version activation. Completed repeats return the
        same result; no key release. An original unexpired access credential may replay
        only its own completed PASSWORD_CHANGE result, bound to its initiating family
        and operation expiry; revocation still denies every other capability.
        Expired/cancelled/newer credential versions reject all writes.
      security:
      - bearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
          headers:
            Cache-Control:
              schema:
                const: no-store
              description: Sensitive responses are never cached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
