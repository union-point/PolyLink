  /auth/recovery/unlock:
    post:
      operationId: recoveryUnlock
      description: Server selects account, Transit key and stored service copy. Always
        selects RECOVERY_SERVICE, requiring new identity and vault key. Never accepts
        arbitrary ciphertext or userId. No access after completion.
      security:
      - recoveryCookie: []
      responses:
        '200':
          description: Authorized transient vault-key release to this recovery session
            only.
          content:
            application/json:
              schema:
