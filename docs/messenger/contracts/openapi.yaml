        schema:
          $ref: '#/components/schemas/Uuid'
  /users/{userId}:
    get:
      operationId: ownIdentityProfile
      description: M1 owner-only identity header; foreign accounts return NOT_FOUND.
        This does not expose registry or authentication state.
      security:
      - bearer: []
      parameters:
      - name: userId
        in: path
        required: true
