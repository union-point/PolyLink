        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectRequest'
  /chat/rooms:
    get:
      operationId: rooms
      description: First page fixes a 30-second server snapshot of visible room summaries,
        sorted room activity time descending then roomId. Opaque cursors bind account/snapshot.
        Poll starts a new scan, completes all pages and reconciles by id. Expired
        snapshot returns REVISION_CONFLICT and restarts scan; never discard unseen
        rooms on incomplete scans.
      security:
      - bearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPage'
          headers:
            Cache-Control:
              schema:
                const: no-store
              description: Sensitive responses are never cached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
