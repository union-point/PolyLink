          description: Minimal own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnIdentityProfile'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Opaque 32-byte random access credential, memory only; 10-minute
        lifetime; server checks revocation/version every request.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-plk-refresh
      description: Secure HttpOnly SameSite=Lax Path=/; 7-day idle / 30-day absolute;
        rotation coordinated across tabs. Identical previous-refresh retry returns
        the same encrypted replay result for 10 seconds; it never creates another
        family or extends the absolute lifetime.
    recoveryCookie:
      type: apiKey
      in: cookie
      name: __Host-plk-recovery
      description: Secure HttpOnly SameSite=Lax Path=/; 30 minutes from verification,
        purpose/operation/version bound.
    challengeCookie:
      type: apiKey
      in: cookie
      name: __Host-plk-challenge
      description: Secure HttpOnly SameSite=Lax Path=/ browser binding for EMAIL_VERIFY/LOGIN
        challenges; renews for 10 minutes on successful resend. Stores random proof
        only; no password-derived material.
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
      description: For mutating cookie-auth requests, echo the __Host-plk-refresh-csrf
        cookie in X-CSRF-Token. It is a random session-bound value whose hash is stored
        by the server, separate from the HttpOnly refresh credential. All mutating
        requests, including login and verification, require an allowed Origin. Recovery
        has a separate cookie/CSRF context when implemented.
  responses:
    Error:
      description: Safe error; no secret values. saveOutcome=not_saved only when the
        original competing request has resolved and no operation was committed. Retry-After
        accompanies rate/service limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]{0,9}$
      maxLength: 10
    Version:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      maxLength: 19
    Uuid:
      type: string
      format: uuid
      maxLength: 36
    Time:
      type: string
      format: date-time
      pattern: Z$
    Email:
      type: string
      format: email
      maxLength: 255
    Secret:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      minLength: 43
      maxLength: 43
      writeOnly: true
    B64:
      type: string
      pattern: ^[A-Za-z0-9_-]+$
      maxLength: 1398123
    Nonce:
      type: string
      pattern: ^[A-Za-z0-9_-]{32}$
      minLength: 32
      maxLength: 32
    Versions:
      type: object
      additionalProperties: false
      properties:
        credential:
          $ref: '#/components/schemas/Version'
        vaultKey:
          $ref: '#/components/schemas/Version'
        vaultRevision:
          $ref: '#/components/schemas/Version'
        identity:
          $ref: '#/components/schemas/Version'
      required:
      - credential
      - vaultKey
      - vaultRevision
      - identity
    RoomVersions:
      type: object
      additionalProperties: false
      properties:
        membership:
          $ref: '#/components/schemas/Version'
        roomKey:
          $ref: '#/components/schemas/Version'
      required:
      - membership
      - roomKey
    Derivation:
      type: object
      additionalProperties: false
      properties:
        scheme:
          const: PLK1
        salt:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
        opsLimit:
          type: integer
          minimum: 2
          maximum: 4
        memoryBytes:
          type: integer
          minimum: 67108864
          maximum: 268435456
      required:
      - scheme
      - salt
      - opsLimit
      - memoryBytes
    EmailRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
      required:
      - email
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        loginSecret:
          $ref: '#/components/schemas/Secret'
        scheme:
          const: PLK1
      required:
      - email
      - loginSecret
      - scheme
    RegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        loginSecret:
          $ref: '#/components/schemas/Secret'
        derivation:
          $ref: '#/components/schemas/Derivation'
        role:
          type: string
          enum:
          - graduate
          - lecturer
      required:
      - email
      - firstName
      - lastName
      - loginSecret
      - derivation
      - role
    Challenge:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Time'
        resendAfter:
          $ref: '#/components/schemas/Time'
      required:
      - challengeId
      - expiresAt
      - resendAfter
    CodeProof:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - challengeId
      - code
    ResendRequest:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
      required:
      - challengeId
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
          - graduate
          - lecturer
        admission:
          type: string
          enum:
          - PENDING
          - ADMITTED
          - DEACTIVATED
        emailVerified:
          type: boolean
        emailFactorEnabled:
          type: boolean
        email:
          $ref: '#/components/schemas/Email'
        onboardingComplete:
          type: boolean
          description: M1 minimal identity enrollment is complete; academic-profile
            editing remains separate.
      required:
      - id
      - firstName
      - lastName
      - role
      - admission
      - emailVerified
      - emailFactorEnabled
      - email
      - onboardingComplete
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        familyId:
          $ref: '#/components/schemas/Uuid'
        versions:
          $ref: '#/components/schemas/Versions'
        keySetupRequired:
          type: boolean
      required:
      - user
      - familyId
      - versions
      - keySetupRequired
    Authenticated:
      type: object
      additionalProperties: false
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
          writeOnly: false
        expiresAt:
          $ref: '#/components/schemas/Time'
        session:
          $ref: '#/components/schemas/Session'
      required:
      - status
      - accessToken
      - expiresAt
      - session
    LoginChallenge:
      type: object
      additionalProperties: false
      properties:
        status:
          const: challenge
        challenge:
          $ref: '#/components/schemas/Challenge'
      required:
      - status
      - challenge
    LoginResult:
      oneOf:
      - $ref: '#/components/schemas/Authenticated'
      - $ref: '#/components/schemas/LoginChallenge'
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - VALIDATION
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - RATE_LIMITED
          - REVISION_CONFLICT
          - KEY_STALE_NOT_SAVED
          - ROOM_KEY_PENDING
          - OPERATION_PAYLOAD_CONFLICT
          - RECOVERY_EXPIRED
          - RECOVERY_CANCELLED
          - SERVICE_UNAVAILABLE
          - DATA_INTEGRITY
        message:
          type: string
          maxLength: 500
        retryAfterSeconds:
          type: integer
          minimum: 0
        saveOutcome:
          type: string
          enum:
          - not_saved
          - unknown
      required:
      - code
      - message
      allOf:
      - if:
          properties:
            code:
              enum:
              - KEY_STALE_NOT_SAVED
              - ROOM_KEY_PENDING
        then:
          required:
          - saveOutcome
          properties:
            saveOutcome:
              const: not_saved
        else:
          properties:
            saveOutcome:
              const: unknown
    CipherPacket:
      type: object
      additionalProperties: false
      properties:
        scheme:
          const: PLK1
        nonce:
          $ref: '#/components/schemas/Nonce'
        ciphertext:
          $ref: '#/components/schemas/B64'
      required:
      - scheme
      - nonce
      - ciphertext
    PasswordCopy:
      type: object
      additionalProperties: false
      properties:
        scheme:
          const: PLK1
        nonce:
          $ref: '#/components/schemas/Nonce'
        ciphertext:
          type: string
          pattern: ^[A-Za-z0-9_-]{64}$
          minLength: 64
          maxLength: 64
      required:
      - scheme
      - nonce
      - ciphertext
    Identity:
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        version:
          $ref: '#/components/schemas/Version'
        publicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
      required:
      - userId
      - version
      - publicKey
    VaultBundle:
      type: object
      additionalProperties: false
      properties:
        versions:
          $ref: '#/components/schemas/Versions'
        vault:
          $ref: '#/components/schemas/CipherPacket'
        passwordCopy:
          $ref: '#/components/schemas/PasswordCopy'
        identity:
          $ref: '#/components/schemas/Identity'
      required:
      - versions
      - vault
      - passwordCopy
      - identity
    PrepareKeyPackage:
      type: object
      additionalProperties: false
      properties:
        operationId:
          $ref: '#/components/schemas/Uuid'
        expected:
          $ref: '#/components/schemas/Versions'
        derivation:
          $ref: '#/components/schemas/Derivation'
        loginSecret:
          $ref: '#/components/schemas/Secret'
        vault:
          $ref: '#/components/schemas/CipherPacket'
        passwordCopy:
          $ref: '#/components/schemas/PasswordCopy'
        identity:
          $ref: '#/components/schemas/Identity'
        serviceVaultKey:
          $ref: '#/components/schemas/Secret'
        kind:
          type: string
          enum:
          - SETUP
          - PASSWORD_CHANGE
          - RECOVERY_LOCAL
          - RECOVERY_SERVICE
      required:
      - operationId
      - expected
      - derivation
      - loginSecret
      - vault
      - passwordCopy
      - identity
      - kind
      allOf:
      - if:
          properties:
            kind:
              enum:
              - SETUP
              - RECOVERY_SERVICE
        then:
          required:
          - serviceVaultKey
        else:
          not:
            required:
            - serviceVaultKey
    OperationRequest:
      type: object
      additionalProperties: false
      properties:
        operationId:
          $ref: '#/components/schemas/Uuid'
      required:
      - operationId
    OperationStatus:
      type: object
      additionalProperties: false
      properties:
        operationId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
          - SETUP
          - PASSWORD_CHANGE
          - RECOVERY_LOCAL
          - RECOVERY_SERVICE
        state:
          type: string
          enum:
          - VERIFIED
          - PREPARING
          - WAITING_SERVICE
          - READY
          - COMPLETED
          - CANCELLED
          - EXPIRED
        expiresAt:
          $ref: '#/components/schemas/Time'
        baseVersions:
          $ref: '#/components/schemas/Versions'
        resultVersions:
          $ref: '#/components/schemas/Versions'
      required:
      - operationId
      - kind
      - state
      - expiresAt
      - baseVersions
      allOf:
      - if:
          properties:
            state:
              const: COMPLETED
        then:
          required:
          - resultVersions
    RecoveryVerified:
      type: object
      additionalProperties: false
      properties:
        operation:
