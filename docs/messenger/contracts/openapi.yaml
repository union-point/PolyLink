        schema:
          $ref: '#/components/schemas/Id'
  /chat/rooms/{roomId}/attachments:
    post:
      operationId: upload
      description: Client-generated ID is bound to authenticated uploader/room. Identical
        upload retries return same object, changed bytes conflict. Private staged
        object expires after 24 hours if unbound. An unsaved send may reuse its staged
        object under a new operation in the same room. A bound object cannot be reused.
      security:
      - bearer: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
          headers:
            Cache-Control:
              schema:
                const: no-store
              description: Sensitive responses are never cached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
      - name: X-Attachment-Id
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 5242896
  /chat/attachments/{attachmentId}:
    get:
      operationId: download
      description: Bearer-authorized current history/membership check. Return ciphertext
        only; client decrypts and validates, renders blob URL.
      security:
      - bearer: []
