            schema:
              $ref: '#/components/schemas/Empty'
      parameters: *id002
  /chat/blocks/{userId}:
    put:
      operationId: block
      description: Own block only; direct sending denied both ways, no effect on group
        sending or retained history.
      security:
      - bearer: []
      responses:
        '204':
          description: Completed
          headers:
            Cache-Control:
              schema:
                const: no-store
              description: Sensitive responses are never cached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
