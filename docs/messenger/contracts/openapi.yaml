        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
  /chat/direct:
    post:
      operationId: openDirect
      description: Unique unordered pair. Never self. Reopening retains caller history
        cutoff; race returns winning room.
      security:
      - bearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
          headers:
