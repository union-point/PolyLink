<!DOCTYPE html>
<html lang="hy">

<head>
  <link rel="icon" type="image/svg+xml" href="./image/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Մոռացե՞լ եք գաղտնաբառը | PolyLink</title>
  <link rel="stylesheet" href="./css/auth.css" />
</head>

<body>
  <div class="container">
    <div class="login-box">
      <div class="logo-container">
        <img class="img" src="./image/logo.png" alt="PolyLink">
        <h1 class="logo-text">PolyLink</h1>
      </div>
      <p class="info-text">
        Մուտքագրեք Ձեր գրանցված «Պոլիտեխնիկի» էլ. փոստի հասցեն։ Մենք կուղարկենք գաղտնաբառը վերականգնելու կոդը։
      </p>

      <form novalidate id="forgot-form">
        <label for="email">«Պոլիտեխնիկի» էլ. փոստ</label>
        <input type="email" id="email" name="email" autocomplete="email" maxlength="255" required placeholder="name@polytechnic.am" />

        <button type="submit" class="signin-btn btn-t">Ուղարկել վերականգնման կոդը</button>

        <p class="bottom-text">
          Հիշեցի՞ք Ձեր գաղտնաբառը։ <a href="login.html">Մուտք</a>
        </p>
      </form>
    </div>
  </div>
  <script type="module" src="./js/forgot.js"></script>

</body>

</html>
