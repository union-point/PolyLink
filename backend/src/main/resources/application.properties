spring.application.name=polylink-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:3004}

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:polylink};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Migrations run explicitly through SchemaCommand, never against an unreviewed DB at startup.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# M1 is opt-in until deployment prerequisites and explicit migrations are configured.
polylink.identity.enabled=${IDENTITY_ENABLED:true}
polylink.frontend-origins=${FRONTEND_ORIGINS:http://localhost:8001}
polylink.auth.hmac-key=${AUTH_HMAC_KEY:}
polylink.auth.replay-key=${AUTH_REPLAY_KEY:}
polylink.openbao.url=${OPENBAO_URL:https://localhost:18200}
polylink.openbao.token-file=${OPENBAO_TOKEN_FILE:./secrets/openbao.token}
polylink.openbao.allow-loopback-http=${OPENBAO_ALLOW_LOOPBACK_HTTP:false}
polylink.mail.from=${MAIL_FROM:no-reply@polylink.invalid}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-binding-errors=never
