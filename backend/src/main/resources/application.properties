spring.application.name=polylink-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:3004}

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:polylink};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# The restored schema has not been reconciled with the later SQL scripts yet.
# Enable Flyway only after reviewing and explicitly baselining that schema.
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
