name: Backend

on:
  pull_request:
    paths: ["backend/**", "db/**", "infra/openbao/**", "js/**", "docs/messenger/**", "tools/contracts/**", "tools/m1/**", ".github/workflows/backend.yml"]
  push:
    paths: ["backend/**", "db/**", "infra/openbao/**", "js/**", "docs/messenger/**", "tools/contracts/**", "tools/m1/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Disposable CI container credentials; never used outside this job.
      MSSQL_SA_PASSWORD: CIOnly_PolyLink_7f925!
      DB_PASSWORD: CIOnly_PolyLink_7f925!
      DB_TEST_ADMIN_PASSWORD: CIOnly_PolyLink_7f925!
      DB_NAME: polylink_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/m1/package-lock.json
      - name: Start SQL Server
        working-directory: db
        run: docker compose up -d --wait --wait-timeout 180 sqlserver
      - name: Create isolated test database
        working-directory: db
        run: |
          docker compose exec -T sqlserver sh -c 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "CREATE DATABASE [polylink_ci]"'
      - name: Install browser acceptance dependencies
        working-directory: .
        run: |
          npm ci --prefix tools/m1 --ignore-scripts
          npx --prefix tools/m1 playwright install --with-deps chromium
      - name: Verify SQL migrations, identity HTTP, TLS Transit, SMTP, and browser flows
        working-directory: .
        run: python3 tools/m1/verify.py --browser
      - name: Stop SQL Server
        working-directory: db
        if: always()
        run: docker compose down

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/contracts/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/contracts/package-lock.json
      - name: Validate OpenAPI and transition fixtures
        run: |
          python -m pip install -r tools/contracts/requirements.txt
          python tools/contracts/validate.py
      - name: Validate pinned crypto vectors
        run: |
          npm ci --prefix tools/contracts --ignore-scripts
          npm test --prefix tools/contracts
      - name: Verify vendored browser crypto matches the pinned source
        run: |
          node tools/contracts/vendor-sodium.mjs
          git diff --exit-code -- js/crypto/vendor
