<!DOCTYPE html>
<html lang="hy">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Գրանցում | PolyLink</title>
  <link rel="stylesheet" href="./css/auth.css" />

</head>

<body>
  <div class="container">
    <div class="login-box">
      <div class="logo-container-horizontal">
        <img class="pi-img" src="./image/logo.png" alt="PolyLink">
        <h1 class="pi-logo-text">PolyLink</h1>
      </div>
      <form novalidate id="register-form">
        

        <label for="firstname">Անուն</label>
        <input type="text" id="firstname" name="firstName" autocomplete="given-name" maxlength="100" required placeholder="Ձեր անունը" />
        <label for="lastname">Ազգանուն</label>
        <input type="text" id="lastname" name="lastName" autocomplete="family-name" maxlength="100" required placeholder="Ձեր ազգանունը" />

        <label for="email">«Պոլիտեխնիկի» էլ. փոստ</label>
        <input type="email" id="email" name="email" autocomplete="email" maxlength="255" required placeholder="name@polytechnic.am" />

        <label for="password"> Գաղտնաբառ</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" autocomplete="new-password" maxlength="128" required placeholder="Մուտքագրեք գաղտնաբառ" />
          <button type="button" class="toggle-password" id="toggle-new">👁️</button>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar" id="strength-bar"></div>
        </div>
        <div class="logo-container-horizontal">

          <div class="strength-text" id="strength-text"></div>

          <label for="confirm">Հաստատեք գաղտնաբառը</label>
        </div>

        <div class="password-wrapper">
          <input type="password" id="confirm" name="confirmPassword" autocomplete="new-password" maxlength="128" required placeholder="Կրկին մուտքագրեք գաղտնաբառը" />
          <button type="button" class="toggle-password" id="toggle-confirm">👁️</button>
        </div>

        <div class="password-requirements">
          <h4>Գաղտնաբառի պահանջներ՝</h4>
          <div class="requirement" id="req-length">8–128 նիշ</div>
          <div class="requirement" id="req-uppercase">Առնվազն 1 լատինական մեծատառ</div>
          <div class="requirement" id="req-number">Առնվազն 1 թիվ</div>
          <div class="requirement" id="req-special">Առնվազն 1 հատուկ նիշ (!@#$%^&*)</div>
        </div>

        <button type="submit" class="signin-btn" id="submit-btn">Գրանցվել</button>

        <p class=" bottom-text">
          Արդեն ունե՞ք հաշիվ։ <a href="login.html">Մուտք</a>
        </p>
      </form>
    </div>
  </div>

  <script type="module" src="./js/register.js"></script>


</body>


</html>
