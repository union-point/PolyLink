<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Նոր գաղտնաբառ | PolyLink</title>
    <link rel="stylesheet" href="./css/auth.css" />
</head>

<body>
    <div class="container">
        <div class="login-box">
            <div class="logo-container">
                <img class="img" src="./image/logo.png" alt="Logo" class="logo-img">
                <h1 class="logo-text">PolyLink</h1>
            </div>
            <p class="info-text">
                Ստեղծեք նոր, ապահով գաղտնաբառ Ձեր հաշվի համար։
            </p>

            <form id="reset-form">
                <label for="new-password">Նոր գաղտնաբառ</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" disabled placeholder="Մուտքագրեք նոր գաղտնաբառը" />
                    <button type="button" class="toggle-password" id="toggle-new">👁️</button>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="strength-bar"></div>
                </div>
                <div class="logo-container-horizontal">
                    <div class="strength-text" id="strength-text"></div>
                    <label for="confirm-password">Հաստատեք գաղտնաբառը</label>
                </div>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" disabled placeholder="Կրկին մուտքագրեք գաղտնաբառը" />
                    <button type="button" class="toggle-password" id="toggle-confirm">👁️</button>
                </div>

                <div class="password-requirements">
                    <h4>Գաղտնաբառի պահանջներ՝</h4>
                    <div class="requirement" id="req-length">Նվազագույնը 8 նիշ</div>
                    <div class="requirement" id="req-uppercase">Առնվազն 1 մեծատառ</div>
                    <div class="requirement" id="req-number">Առնվազն 1 թիվ</div>
                    <div class="requirement" id="req-special">Առնվազն 1 հատուկ նիշ (!@#$%^&*)</div>
                </div>

                <button type="submit" class="signin-btn btn-t" id="submit-btn" disabled>Փոխել գաղտնաբառը</button>

                <p class="bottom-text">
                    <a href="login.html">← Վերադառնալ մուտք</a>
                </p>
            </form>
        </div>
    </div>

    <script type="module" src="./js/password-reset.js"></script>

</body>

</html>
