<!DOCTYPE html>

<html lang="hy">
<head>
  <link rel="icon" type="image/svg+xml" href="./image/favicon.svg">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Նամակագրություն</title>
<link href="./css/style.css" rel="stylesheet"/>
<link href="./css/message.css" rel="stylesheet"/>
</head>
<body class="messenger-page">
<header class="header">
<div class="header-container">
<div class="logo-container">
<img alt="PolyLink" class="logo-img" src="./image/logo.png"/>
<h3 class="logo-text">PolyLink</h3>
</div>
<nav>
<ul class="menu">
<li><a href="profile.html">Անձնական էջ</a></li>
<li><a href="events.html">Իրադարձություններ</a></li>
<li><a href="forum.html">Ֆոռում</a></li>
<li><a class="active" href="message.html">Նամակագրություն</a></li>
<li><a href="search.html">Որոնում</a></li>
</ul>
<!-- Dropdown menu -->
<div class="dropdown-container">
<button class="dropdown-btn">☰</button>
<ul class="dropdown-menu">
<li class="mobile-nav"><a href="profile.html">Անձնական էջ</a></li>
<li class="mobile-nav"><a href="events.html">Իրադարձություններ</a></li>
<li class="mobile-nav"><a href="forum.html">Ֆոռում</a></li>
<li class="mobile-nav"><a href="message.html">Նամակագրություն</a></li>
<li class="mobile-nav"><a href="search.html">Որոնում</a></li>
<li><a href="help.html">Օգնություն</a></li>
<li><a href="settings.html">Կարգավորումներ</a></li>
<li><a href="login.html">Դուրս գալ</a></li>
</ul>
</div>
</nav>
</div>
</header>
<main class="chat-container" aria-label="Նամակագրություն">
<div class="container">
<div class="sidebar">
<div class="sidebar-header">
<div class="sidebar-title"><h1>Նամակագրություն</h1></div>
<div class="search-box">
<input placeholder="Որոնել զրույցներում" type="text"/>
</div>
</div>
<div class="chat-list" aria-label="Զրույցներ"></div>
<div class="sidebar-footer">Ձեր զրույցները՝ մեկ տեղում</div>
</div>
<div class="chat-area">
<div class="chat-header-main">
<button class="contact-info" type="button" disabled>
<span class="avatar"></span>
<span class="contact-details">
<span class="contact-name"></span>
<span class="contact-status"></span>
</span>
</button>
<div class="chat-actions">
<button class="action-icon" type="button">🔍</button>
<button class="action-icon menu-btn" type="button">⋮</button>
</div>
</div>
<div class="messages" role="region" aria-label="Հաղորդագրություններ" tabindex="0"></div>
<div class="message-input">
<button class="input-icon emoji-btn" type="button">😊</button>
<input placeholder="Գրել հաղորդագրություն..." type="text"/>
<button class="input-icon attachment-btn" type="button">📎</button>
<button class="input-icon send-icon" type="button">➤</button>
</div>
</div>
</div>
</main>
<script src="./js/chat.js" type="module"></script>
</body>
</html>
