<!DOCTYPE html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="icon" href="image/favicon.svg" type="image/svg+xml"><title>Ադմինիստրատորի գրանցում | PolyLink</title><link rel="stylesheet" href="css/admin-auth.css"></head>
<body data-admin-mode="register"><main><a href="index.html">PolyLink</a><h1>Ադմինիստրատորի գրանցում</h1>
<p id="message" role="status" aria-live="polite"></p>
<form id="credentials" hidden><label for="firstName">Անուն</label><input id="firstName" name="firstName" autocomplete="given-name" maxlength="100" required>
<label for="lastName">Ազգանուն</label><input id="lastName" name="lastName" autocomplete="family-name" maxlength="100" required><label for="email">Էլ. փոստ</label><input type="email" id="email" name="email" autocomplete="username" maxlength="255" required readonly>
<label for="password">Գաղտնաբառ</label><input type="password" id="password" name="password" autocomplete="new-password" maxlength="128" required><small>8–128 նիշ, լատինական մեծատառ, թիվ և հատուկ նիշ։</small><label for="confirmation">Հաստատեք գաղտնաբառը</label><input type="password" id="confirmation" name="confirmation" autocomplete="new-password" maxlength="128" required><button type="submit">Շարունակել</button></form>
<form id="verification" hidden><p>Մուտքագրեք էլ. փոստին ուղարկված կոդը։</p><label for="code">Հաստատման կոդ</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Հաստատել</button><button type="button" class="secondary" id="resend">Ուղարկել կրկին</button></form>
<section id="success" hidden><p id="account"></p><button type="button" id="logout" hidden>Դուրս գալ</button><p><a href="admin-login.html">Ադմինիստրատորի մուտք</a></p></section>
<p><a href="login.html">Օգտատիրոջ մուտք</a></p>
<script type="module" src="js/admin/access-page.js"></script></main></body></html>
