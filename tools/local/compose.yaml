# Copied into the private local state directory by setup.sh; paths survive worktrees.
name: polylink-security
services:
  prepare-openbao:
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    user: "0:0"
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        cp /source/server.crt /tls/server.crt
        cp /source/server.key /tls/server.key
        chown 100:1000 /tls /tls/server.crt /tls/server.key /data
        chmod 700 /tls /data
        chmod 600 /tls/server.key
        chmod 644 /tls/server.crt
    volumes:
      - ./tls:/source:ro,Z
      - openbao-local-tls:/tls
      - openbao-data:/data
  openbao:
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    command: server -config=/openbao/config/openbao.hcl
    depends_on:
      prepare-openbao:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18200:8200"
    volumes:
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro,Z
      - openbao-local-tls:/openbao/tls:ro
      - openbao-data:/openbao/data
    environment:
      BAO_ADDR: https://localhost:8200
      BAO_CACERT: /openbao/tls/server.crt
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  openbao-data:
  openbao-local-tls:
